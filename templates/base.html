<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Golden Goose{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
    
        <!-- Logo -->
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='images/lightmode.svg') }}" 
                    alt="Logo" width="120" height="96"
                    class="d-inline-block align-text-top">
                </a>

            <!-- Mobile toggle -->
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

        <!-- Links -->
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                     </li>

                     <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('countdown') }}">Countdown</a>
                     </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('mischief') }}">Socials</a>
                    </li>

                    <!-- Albums dropdown -->
                    <li class="nav-item albums">
                        <a class="nav-link dropdown-toggle" href="#" role="button"
                        data-bs-toggle="albums" aria-expanded="false">
                        Albums / Singles
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="{{ url_for('captivated') }}">Captivated</a>
                            </li>
                            <li>
                                <a href="{{url_for('singles' )}}" class="dropdown-item"></a>
                            </li>
                <!-- Add more routes later -->
                        </ul>
                    </li>

            <!-- Theme toggle -->
            <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button"
                data-bs-toggle="dropdown">
                Theme
            </a>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#" id="lightModeBtn">Light Mode</a></li>
                <li><a class="dropdown-item" href="#" id="darkModeBtn">Dark Mode</a></li>
            </ul>
                </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Page content -->
    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
